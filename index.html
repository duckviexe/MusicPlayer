<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrowave Player</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&family=Baloo+2:wght@600&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: #8c4b6f;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* --- VISUAL LAYERS --- */

        /* LAYER 1: PINK.PNG */
        #bg-pink-img {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            max-width: 95vw;
            max-height: 95vh;
            width: auto; height: auto;
            z-index: 1;
            pointer-events: none;
        }

        /* LAYER 2: GIFs */
        .gif-overlay {
            position: absolute;
            z-index: 5; 
            pointer-events: none; 
            opacity: 1; 
        }

        /* 1.gif */
        #gif1 {
            width: 120px;
            top: 49%;
            left: calc(50% - 347px); 
            transform: translateY(calc(-50% + 100px)); 
        }

        /* 2.gif */
        #gif2 {
            width: 140px;
            top: 100px;
            right: 52px;
        }

        /* 12345.gif */
        #gif3 {
            width: 255px;
            top: 97px;
            left: 55px; 
        }

        /* 3.gif */
        #gif4 {
            width: 250px;
            bottom: 97px;
            right: 50px;
        }

        /* LAYER 3: SCANLINES */ 
        .scanlines-layer {
            position: fixed; inset: 0; pointer-events: none; z-index: 10;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
        }

        /* LAYER 4: PLAYER (FLAT INTEGRATED STYLE) */
        .cassette-player {
            /* --- GEOMETRY (PRESERVED) --- */
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            margin-top: 20px; 
            width: 180px; 
            height: 300px;
            z-index: 20; 
            /* --------------------------- */

            /* --- FLAT / INTEGRATED STYLE --- */
            /* Removed blur and heavy shadows to make it sit flat */
            background: rgba(0, 0, 0, 0.2); /* Very subtle tint to group elements */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Faint outline */
            border-radius: 24px;
            box-shadow: none; /* Removed "pop-up" shadow */
            
            display: flex; 
            flex-direction: column;
            align-items: center;
            padding: 20px; 
            gap: 15px;
            overflow: hidden;
        }

        /* Modern Visualizer - Adjusted for flat look */
        .visualizer {
            width: 120px; height: 120px;
            border-radius: 50%;
            /* Removed heavy bevels/gradients for a flatter look */
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: center; align-items: center;
            margin-top: 10px;
            position: relative;
        }
        
        .pulse-ring {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #ff1493;
            box-shadow: 0 0 15px #ff1493;
            transition: transform 0.1s;
        }
        .visualizer.playing .pulse-ring {
            animation: modernPulse 1.5s infinite ease-in-out;
        }
        @keyframes modernPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Modern Text */
        .track-info {
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: auto;
            /* Added text shadow for legibility without heavy background */
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Modern Controls */
        .mod-controls {
            width: 100%;
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
        }

        .mod-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s, color 0.2s;
            /* Added drop shadow to separate from background image */
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }
        .mod-btn:hover { color: #ff69b4; }
        .mod-btn:active { transform: scale(0.9); }
        .mod-btn.play { font-size: 32px; color: #fff; }
        .mod-btn.play:hover { color: #ff1493; }

        /* --- UI OVERLAYS --- */
        .window-controls { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 20000; -webkit-app-region: no-drag; }
        .menu-wrapper { position: fixed; top: 10px; left: 10px; z-index: 20000; -webkit-app-region: no-drag; }
        .win-btn, .dots-btn { background: rgba(0,0,0,0.5); border: 2px solid white; color: white; cursor: pointer; pointer-events: auto; }
        .win-btn { width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-family: 'VT323'; }
        .win-btn:hover { background-color: white !important; color: #a64d79 !important; }
        .dots-btn { width: 35px; height: 35px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 4px; }
        .dots-btn:hover { background: rgba(255,255,255,0.2); }
        .dot { width: 4px; height: 4px; background: white; border-radius: 50%; }
        
        .dropdown, .settings-modal { position: absolute; background: #222; border: 2px solid white; display: none; z-index: 20001; -webkit-app-region: no-drag; font-family: 'VT323'; }
        .dropdown { top: 40px; left: 0; width: 160px; flex-direction: column; } .dropdown.open { display: flex; }
        .menu-item { padding: 10px; color: white; font-size: 16px; cursor: pointer; border-bottom: 1px solid #444; } .menu-item:hover { background: #007aff; }
        .settings-modal { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 220px; padding: 12px; color: white; }
        .setting-row { margin-bottom: 12px; } .slider { width: 100%; accent-color: #a64d79; }

        /* --- CENTER STATUS --- */
        #centerStatus {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 3; display: flex; align-items: center; gap: 8px; visibility: hidden; pointer-events: none;
        }
        .status-dot { width: 12px; height: 12px; background-color: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; animation: blink 1s infinite; }
        .status-text { color: #00ff00; font-family: 'VT323'; font-size: 24px; text-shadow: 0 0 10px #00ff00; letter-spacing: 2px; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* --- IPOD PLAYLIST --- */
        .ipod-overlay { position: fixed; inset: 0; z-index: 90000; display: none; justify-content: center; align-items: center; -webkit-app-region: no-drag; }
        .ipod-overlay.active { display: flex; }
        .ipod { width: 230px; height: 350px; background: #cc72bf; border-radius: 18px; border: 3px solid #a35b99; padding: 15px; display: flex; flex-direction: column; align-items: center; font-family: 'Inter', sans-serif; box-shadow: 15px 15px 50px rgba(0,0,0,0.5); pointer-events: auto; position: relative; }
        .screen { width: 100%; height: 130px; background: #fff; border: 2px solid #111; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .header { background: #111; color: white; padding: 6px; font-size: 11px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #playingLabel { color: #2ecc71; visibility: hidden; }
        .list { padding: 0; margin: 0; flex: 1; overflow-y: auto; list-style: none; }
        .list li { padding: 4px; font-size: 11px; border-bottom: 1px solid #ccc; cursor: pointer; color: #111; display: flex; gap: 4px; align-items: center; }
        .list li:hover { background: #2980b9; color: white; }
        .track-name { flex: 1; pointer-events: none; } .track-btn { font-size: 10px; padding: 0 4px; cursor: pointer; border: 1px solid #666; }
        .wheel { margin-top: 30px; width: 120px; height: 120px; background: #ddd; border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; }
        .c-btn { width: 45px; height: 45px; background: #bbb; border-radius: 50%; border: none; cursor: pointer; font-size: 24px; font-weight: bold; }
        .lbl { position: absolute; font-size: 10px; color: #777; font-weight: bold; pointer-events: none; } .l-top { top: 10px; } .l-bot { bottom: 10px; }

        /* XP Dialog */
        .xp-dialog { position: absolute; width: 220px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ece9d8; border: 2px solid #003c74; font-family: sans-serif; font-size: 11px; display: none; z-index: 100000; box-shadow: 4px 4px 0 rgba(0,0,0,0.3); }
        .xp-titlebar { background: linear-gradient(90deg, #ff4da6, #0a246a); color: white; padding: 2px 6px; display: flex; justify-content: space-between; }
        .xp-body { padding: 8px; } .xp-body input { width: 100%; margin-top: 4px; } .xp-buttons { margin-top: 8px; display: flex; justify-content: flex-end; gap: 6px; }

        /* Loading */
        .loading-screen { position: fixed; inset: 0; background: #ff1493; display: flex; align-items: center; justify-content: center; z-index: 200000; transition: opacity 0.5s; pointer-events: auto; }
        .loading-content { text-align: center; position: relative; top: 100px; }
        .loading-bar { width: 200px; height: 16px; border: 2px solid white; background: #ff8acb; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
        .loading-progress { width: 40%; height: 100%; background: white; animation: load 1s infinite; }
        @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
        .loading-text { color: white; font-family: 'Baloo 2', cursive; font-size: 24px; }
    </style>
</head>
<body>

    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-bar"><div class="loading-progress"></div></div>
            <div class="loading-text">Loading...</div>
        </div>
    </div>

    <!-- BACKGROUND LAYERS -->
    <img src="11.png" id="bg-pink-img" alt="Background">
    <img src="1.gif" class="gif-overlay" id="gif1">
    <img src="2.gif" class="gif-overlay" id="gif2">
    <img src="12345.gif" class="gif-overlay" id="gif3">
    <img src="3.gif" class="gif-overlay" id="gif4">
    <div class="scanlines-layer"></div>

    <!-- CENTER STATUS -->
    <div id="centerStatus"><div class="status-dot"></div><span class="status-text">PLAYING</span></div>

    <!-- MODERN FLAT PLAYER -->
    <div class="cassette-player">
        <!-- Visualizer -->
        <div class="visualizer">
            <div class="pulse-ring"></div>
        </div>
        
        <!-- Status Text -->
        <div class="track-info" id="statusText">NO TRACK</div>

        <!-- Modern Controls -->
        <div class="modern-controls">
            <button class="mod-btn" id="rwBtn">⏮</button>
            <button class="mod-btn play" id="playBtn">▶</button>
            <button class="mod-btn" id="stopBtn">■</button>
            <button class="mod-btn" id="insertBtn" title="Load">⏏</button>
        </div>
    </div>

    <!-- UI -->
    <div class="window-controls">
        <button class="win-btn" id="minBtn">_</button>
        <button class="win-btn" id="closeBtn">X</button>
    </div>

    <div class="menu-wrapper">
        <div class="dots-btn" id="menuBtn"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="dropdown" id="dropdown">
            <div class="menu-item" id="openPlaylist">Playlist</div>
            <div class="menu-item" id="openSettings">Audio Settings</div>
        </div>
    </div>

    <!-- SETTINGS -->
    <div class="settings-modal" id="settingsModal">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #555;"><span>AUDIO SETTINGS</span><span id="closeSettings" style="cursor:pointer">X</span></div>
        <div class="setting-row"><label>Volume</label><input type="range" class="slider" id="volSlider" min="0" max="1" step="0.1" value="1"></div>
        <div class="setting-row"><label>Balance</label><input type="range" class="slider" min="-1" max="1" value="0"></div>
    </div>

    <!-- PLAYLIST -->
    <div class="ipod-overlay" id="ipodOverlay">
        <div class="ipod">
            <div class="screen">
                <div class="header"><span>Playlists 🔋</span><span id="playingLabel">Playing</span></div>
                <ul class="list" id="playlist">
                    <li class="folder" data-folder="Favorites <3">Favorites &lt;3</li>
                </ul>
            </div>
            <div class="xp-dialog" id="xpFolderDialog">
                <div class="xp-titlebar"><span>New Folder</span><button id="xpCloseBtn">x</button></div>
                <div class="xp-body">
                    <div>Folder Name:</div><input type="text" id="xpFolderInput">
                    <div class="xp-buttons"><button id="xpOkBtn">OK</button><button id="xpCancelBtn">Cancel</button></div>
                </div>
            </div>
            <div class="wheel">
                <span class="lbl l-top">MENU</span><span class="lbl l-bot">⏯</span>
                <button class="c-btn" id="addFolderBtn">+</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="audio/*" style="display:none;">

    <script>
        window.addEventListener('load', () => {
            const ls = document.getElementById('loadingScreen');
            setTimeout(() => { ls.style.opacity = '0'; setTimeout(() => { ls.style.display = 'none'; }, 500); }, 1500);
        });

        let ipcRenderer; try { ipcRenderer = require('electron').ipcRenderer; } catch(e) { ipcRenderer = { send: ()=>{} }; }
        document.getElementById('closeBtn').onclick = () => ipcRenderer.send('app-close');
        document.getElementById('minBtn').onclick = () => ipcRenderer.send('app-minimize');

        const audio = new Audio();
        const statusText = document.getElementById('statusText');
        const playlist = document.getElementById('playlist');
        const visualizer = document.querySelector('.visualizer');
        const playingLabel = document.getElementById('playingLabel');
        const centerStatus = document.getElementById('centerStatus');
        let openFolder = null;
        const DEFAULT_FOLDER = "Favorites <3";

        const dropdown = document.getElementById('dropdown');
        document.getElementById('menuBtn').onclick = (e) => { e.stopPropagation(); dropdown.classList.toggle('open'); };
        document.addEventListener('click', () => dropdown.classList.remove('open'));

        const sModal = document.getElementById('settingsModal');
        document.getElementById('openSettings').onclick = () => sModal.style.display = 'block';
        document.getElementById('closeSettings').onclick = () => sModal.style.display = 'none';
        document.getElementById('volSlider').oninput = (e) => audio.volume = e.target.value;

        const ipod = document.getElementById('ipodOverlay');
        document.getElementById('openPlaylist').onclick = () => ipod.classList.add('active');
        ipod.onclick = (e) => { if(e.target === ipod) ipod.classList.remove('active'); };

        const xp = document.getElementById('xpFolderDialog');
        const xpIn = document.getElementById('xpFolderInput');
        document.getElementById('addFolderBtn').onclick = (e) => { e.stopPropagation(); xp.style.display='block'; xpIn.focus(); };
        document.getElementById('xpCloseBtn').onclick = () => xp.style.display='none';
        document.getElementById('xpCancelBtn').onclick = () => xp.style.display='none';
        document.getElementById('xpOkBtn').onclick = (e) => {
            e.stopPropagation();
            const name = xpIn.value.trim();
            if(name && !playlist.querySelector(`li[data-folder="${name}"]`)) {
                const li = document.createElement('li');
                li.className='folder'; li.dataset.folder=name; li.textContent=name;
                playlist.appendChild(li);
            }
            xp.style.display='none';
        };

        document.getElementById('insertBtn').onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').onchange = (e) => {
            const f = e.target.files[0];
            if(!f) return;
            const url = URL.createObjectURL(f);
            audio.src = url;
            statusText.textContent = f.name.substring(0, 20);
            const li = createTrackLi(f.name.substring(0, 15), url, DEFAULT_FOLDER);
            insertTrack(DEFAULT_FOLDER, li);
            stop();
        };

        document.getElementById('playBtn').onclick = () => { if(audio.src) audio.paused ? play() : stop(); };
        document.getElementById('stopBtn').onclick = stop;

        function play(fromList = false) {
            audio.play();
            document.getElementById('playBtn').textContent = "||";
            visualizer.classList.add('playing');
            playingLabel.style.visibility = fromList ? "visible" : "hidden";
            centerStatus.style.visibility = "visible";
        }
        function stop() {
            audio.pause();
            document.getElementById('playBtn').textContent = "▶";
            visualizer.classList.remove('playing');
            playingLabel.style.visibility = "hidden";
            centerStatus.style.visibility = "hidden";
        }
        audio.onended = stop;

        function createTrackLi(name, url, folder) {
            const li = document.createElement('li');
            li.className='track'; li.dataset.url=url; li.dataset.folder=folder; li.dataset.dir="1"; li.style.display="none";
            li.innerHTML = `<span class="track-name">${name}</span><button class="track-btn mv">⇩</button><button class="track-btn del">✕</button>`;
            return li;
        }

        function insertTrack(folder, li) {
            const folders = Array.from(playlist.querySelectorAll('.folder'));
            const target = folders.find(f => f.dataset.folder === folder);
            if(target) {
                let last = target;
                let next = target.nextElementSibling;
                while(next && next.classList.contains('track') && next.dataset.folder === folder) {
                    last = next; next = next.nextElementSibling;
                }
                last.after(li);
            } else playlist.appendChild(li);
            updateVis();
        }

        playlist.addEventListener('click', (e) => {
            const t = e.target;
            if(t.classList.contains('folder')) {
                const f = t.dataset.folder;
                openFolder = (openFolder === f) ? null : f;
                updateVis();
            } else if(t.closest('.track')) {
                const tr = t.closest('.track');
                if(t.classList.contains('del')) tr.remove();
                else if(t.classList.contains('mv')) moveTrack(tr);
                else {
                    audio.src = tr.dataset.url;
                    statusText.textContent = tr.querySelector('.track-name').textContent;
                    play(true);
                }
            }
        });

        function updateVis() {
            playlist.querySelectorAll('.track').forEach(t => {
                t.style.display = (t.dataset.folder === openFolder) ? 'flex' : 'none';
            });
        }

        function moveTrack(li) {
            const allFolders = Array.from(playlist.querySelectorAll('li.folder'));
            let currentF = li.dataset.folder;
            let idx = allFolders.findIndex(f => f.dataset.folder === currentF);
            let dir = parseInt(li.dataset.dir);
            let next = idx + dir;
            if(next >= allFolders.length) { li.dataset.dir="-1"; nextIdx = idx - 1; }
            if(next < 0) { li.dataset.dir="1"; nextIdx = idx + 1; }
            if(allFolders[next]) {
                li.dataset.folder = allFolders[next].dataset.folder;
                insertTrack(allFolders[next].dataset.folder, li);
            }
        }
    </script>
</body>
</html>
